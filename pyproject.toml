[project]
name = "solo-backend"
version = "0.1.0"
description = "Solo HTTP API and DolphinScheduler integration"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apache-dolphinscheduler==4.1.0",
    "bcrypt>=4.3,<5",
    "fastapi>=0.115,<1",
    "mcp>=2,<3",
    "pandas>=2.2,<3",
    "packaging>=24",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=21",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "tomlkit>=0.13,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
